<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能客服</title>
    <link rel="stylesheet" href="/static/index.css?v=7">
</head>
<body>
    <div class="topbar">
        <div class="cs-avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
        </div>
        <div class="brand">智能客服</div>
        <a class="top-link" href="/xianyu">闲鱼运营</a>
        <a class="top-link" href="/admin">后台</a>
    </div>
    <div class="container">
        <div class="chat-area">
            <div class="messages-container" id="messagesContainer"></div>
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea class="input-box" id="messageInput" placeholder="输入消息...（Shift + Enter 换行）" rows="1"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/index.js?v=7"></script>
</body>
</html>
