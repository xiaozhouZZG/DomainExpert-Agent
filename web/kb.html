<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库管理 - EnterpriseAgent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .panel {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h1 { margin-bottom: 20px; }
        input, button { padding: 10px; border: none; border-radius: 6px; margin: 5px; }
        button { background: #4CAF50; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #45a049; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .stat-card { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; text-align: center; }
        .result {
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 知识库管理</h1>

        <div class="panel">
            <h2>统计信息</h2>
            <div class="stats" id="stats">加载中...</div>
        </div>

        <div class="panel">
            <h2>🔍 检索测试</h2>
            <input type="text" id="searchQuery" placeholder="输入检索问题..." style="width: 80%;">
            <button onclick="search()">检索</button>
            <div class="result" id="searchResult"></div>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <a href="/" style="color: #fff; text-decoration: none;">← 返回主页</a>
        </div>
    </div>

    <script>
        async function loadStats() {
            try {
                const res = await fetch('/api/kb/stats');
                const data = await res.json();
                document.getElementById('stats').innerHTML = `
                    <div class="stat-card"><h3>${data.documents}</h3><p>文档数</p></div>
                    <div class="stat-card"><h3>${data.chunks}</h3><p>分块数</p></div>
                    <div class="stat-card"><h3>${data.mode}</h3><p>检索模式</p></div>
                `;
            } catch (e) {
                document.getElementById('stats').textContent = '加载失败';
            }
        }

        async function search() {
            const query = document.getElementById('searchQuery').value;
            if (!query) return;

            const res = await fetch(`/api/kb/search?query=${encodeURIComponent(query)}&top_k=3`, { method: 'POST' });
            const data = await res.json();

            const html = data.results.map((r, i) => `
                <div style="margin: 10px 0; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 6px;">
                    <strong>[${i + 1}] 分数: ${r.score.toFixed(3)}</strong><br>
                    ${r.content.substring(0, 200)}...<br>
                    <small>来源: ${r.source}</small>
                </div>
            `).join('');

            document.getElementById('searchResult').innerHTML = html || '未找到结果';
        }

        loadStats();
    </script>
</body>
</html>
