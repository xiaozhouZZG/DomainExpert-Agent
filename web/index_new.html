<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnterpriseAgent - 企业级智能体平台</title>
    <link rel="stylesheet" href="index.css?v=6">
</head>
<body>
    <!-- 顶栏 -->
    <div class="topbar">
        <div class="brand">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"/>
            </svg>
            EnterpriseAgent
        </div>
        <div class="status-badge offline" id="statusBadge">
            <div class="status-dot"></div>
            <span>离线模式</span>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="container">
        <!-- 左侧栏 - 会话历史 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="createNewChat()">
                    <svg class="icon-sm" viewBox="0 0 24 24">
                        <path d="M12 4v16m8-8H4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    新建对话
                </button>
            </div>
            <div class="sessions-container" id="sessionsContainer">
                <!-- 会话列表动态加载 -->
            </div>
            <div class="sidebar-footer">
                用户: default_user
            </div>
        </div>

        <!-- 中间对话区 -->
        <div class="chat-area">
            <div class="messages-container" id="messagesContainer">
                <div class="welcome-message">
                    <h2>企业级智能体助手</h2>
                    <p>我可以帮您处理客服咨询、订单管理、数据分析等业务</p>
                </div>
            </div>
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea
                        class="input-box"
                        id="messageInput"
                        placeholder="输入消息...（Shift + Enter 换行）"
                        rows="1"
                    ></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- 右侧栏 - 执行过程 -->
        <div class="trace-panel">
            <div class="trace-header">执行过程</div>
            <div class="trace-content" id="traceContent">
                <div class="trace-empty">执行轨迹将在这里显示</div>
            </div>
        </div>
    </div>

    <script src="index.js?v=6"></script>
</body>
</html>
